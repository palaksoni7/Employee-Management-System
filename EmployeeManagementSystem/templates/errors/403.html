{% extends 'base.html' %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-warning fw-bold mb-3">403</div>
    <h3 class="fw-bold mb-2">Access Forbidden</h3>
    <p class="text-muted mb-4">You do not have permission to view or manage this administrative resource.</p>
    <a href="{{ url_for('index') }}" class="btn btn-navy px-4">
        <i class="bi bi-arrow-left me-1"></i> Go Back
    </a>
</div>
{% endblock %}
