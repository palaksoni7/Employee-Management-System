{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-primary fw-bold mb-3">404</div>
    <h3 class="fw-bold mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The page or resource you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-navy px-4">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
