{% extends 'base.html' %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-danger fw-bold mb-3">500</div>
    <h3 class="fw-bold mb-2">Internal Server Error</h3>
    <p class="text-muted mb-4">Something went wrong on our end. Please verify database connectivity or try again.</p>
    <a href="{{ url_for('index') }}" class="btn btn-navy px-4">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
